<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearers Combat Sim</title>
<link rel="stylesheet" href="style.css">
<script>
  // Plain scripts in order (file:// friendly). ?dev swaps in the stub engine (and fake cards if cards.js is missing).
  (function () {
    var dev = /[?&]dev\b/.test(location.search);
    globalThis.BEARERS_DEV = dev;
    globalThis.BEARERS_SCENARIOS = globalThis.BEARERS_SCENARIOS || [];
    globalThis.BEARERS_MISSING = [];
    var files = dev
      ? ["cards.js", "dev/fake-cards.js?if-missing", "dev/stub-engine.js"]
      : ["cards.js", "engine.js", "effects.js?optional"];
    files = files.concat(["scenarios/party.js", "scenarios/skirmish.js", "scenarios/ogre-den.js", "scenarios/chieftain.js", "ui.js"]);
    if (dev && /[?&]demo=selftest\b/.test(location.search)) files.push("dev/selftest.js");
    files.forEach(function (f) {
      var s = document.createElement("script");
      var name = f.split("?")[0], flag = f.split("?")[1];
      s.src = name;
      s.async = false;
      s.onerror = function () { if (!flag) globalThis.BEARERS_MISSING.push(name); };
      document.head.appendChild(s);
    });
  })();
</script>
</head>
<body>
<div id="app"><p class="loading">Loading…</p></div>
</body>
</html>
